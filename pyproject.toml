# Raiz do workspace uv (Eduardo, ST-Q-001). Não é pacote instalável: só
# fixa a versão do Python (INFRA 1.3) e agrega os membros. Cada serviço e
# pacote compartilhado entra em `members` ao receber o próprio pyproject.toml.
[project]
name = "cashflow"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/observabilidade"]

[tool.uv.sources]
observabilidade = { workspace = true }

# Os serviços são pacotes Python com raiz em `services/` (por exemplo,
# `lancamentos.dominio`), mantendo os caminhos de cada tasks.md sem
# colisão de nomes entre serviços (`dominio`, `aplicacao`...).
[tool.pytest.ini_options]
pythonpath = ["services"]

[dependency-groups]
dev = [
    "aio-pika>=10.2.2",
    "pytest>=9.2.0",
    # Membro do workspace instalado no ambiente da raiz para que
    # `uv run pytest packages/observabilidade` rode a partir da raiz.
    "observabilidade",
    {include-group = "migracoes"},
]
# Migrações Alembic dos bancos (ST-Q-005). Grupo próprio para que a imagem de
# migração instale só isto (`uv sync --only-group migracoes`); o grupo dev o
# inclui para `uv run alembic` no host.
migracoes = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
]
