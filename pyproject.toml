# Raiz do workspace uv (Eduardo, ST-Q-001). Não é pacote instalável: só
# fixa a versão do Python (INFRA 1.3) e agrega os membros. Cada serviço e
# pacote compartilhado entra em `members` ao receber o próprio pyproject.toml.
[project]
name = "cashflow"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/observabilidade", "packages/seguranca"]

[tool.uv.sources]
observabilidade = { workspace = true }
seguranca = { workspace = true }

# Os serviços são pacotes Python com raiz em `services/` (por exemplo,
# `lancamentos.dominio`), mantendo os caminhos de cada tasks.md sem
# colisão de nomes entre serviços (`dominio`, `aplicacao`...).
[tool.pytest.ini_options]
pythonpath = ["services"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    # Membro do workspace instalado no ambiente da raiz para que
    # `uv run pytest packages/observabilidade` rode a partir da raiz.
    "observabilidade",
    "seguranca",
    # Cliente do TestClient do FastAPI nos testes da API (002-T5).
    "httpx2>=2.16.0",
    {include-group = "migracoes"},
    {include-group = "lancamentos"},
    {include-group = "relay"},
    {include-group = "consolidado"},
    {include-group = "coordenador"},
]
# Serviço do consolidado (004-T3): worker com aio-pika (ST-Q-004), psycopg 3
# com pool assíncrono (ST-Q-003) e o pacote interno de métricas; a API de
# consulta (004-T5) acrescenta FastAPI e uvicorn (ST-Q-002) e o pacote
# interno de JWT. Grupo próprio para que a imagem do consolidado, comum ao
# worker e à API, instale só isto (`uv sync --only-group consolidado`).
consolidado = [
    "aio-pika>=10.2.2",
    "fastapi>=0.162.0",
    "observabilidade",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "seguranca",
    "uvicorn>=0.54.0",
]
# API de lançamentos (002-T5): FastAPI e uvicorn (ST-Q-002), psycopg 3 com
# pool assíncrono (ST-Q-003) e os pacotes internos de JWT e métricas. Grupo
# próprio para que a imagem da API instale só isto
# (`uv sync --only-group lancamentos`).
lancamentos = [
    "fastapi>=0.162.0",
    "observabilidade",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "seguranca",
    "uvicorn>=0.54.0",
]
# Coordenador da projeção (005-T3): CLI de execução curta, só com psycopg 3
# síncrono (ST-Q-003), sem pool nem /metrics: a fase sai pela API do
# consolidado (007 design §4). Grupo próprio para que a imagem do
# coordenador instale só isto (`uv sync --only-group coordenador`).
coordenador = [
    "psycopg[binary]>=3.3.8",
]
# Migrações Alembic dos bancos (ST-Q-005). Grupo próprio para que a imagem de
# migração instale só isto (`uv sync --only-group migracoes`); o grupo dev o
# inclui para `uv run alembic` no host.
migracoes = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
]
# Relay da outbox (003-T5): aio-pika (ST-Q-004), psycopg 3 com pool
# assíncrono (ST-Q-003) e o pacote interno de métricas. Grupo próprio para
# que a imagem do relay instale só isto (`uv sync --only-group relay`).
relay = [
    "aio-pika>=10.2.2",
    "observabilidade",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
]
