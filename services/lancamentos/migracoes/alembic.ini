# Migrações do banco do livro (002-T2; ST-Q-005; INFRA 3.3).
#
# Rodam com o papel livro_migracao, o único com DDL no esquema public
# (001-T6), separadas da API (design 002 §13). O banco não publica porta no
# host (INFRA 6.2): a execução é pelo serviço `livro-migracao` do compose, na
# rede do livro, a partir da raiz do repositório:
#
#   docker compose -f infra/compose.yaml run --rm --build livro-migracao
#
# A conexão vem de variáveis de ambiente (ver env.py), nunca deste arquivo.
[alembic]
script_location = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
