# Migrações do banco do consolidado (004-T1; ST-Q-005; INFRA 3.3).
#
# Rodam com o papel consolidado_migracao, o único com DDL no esquema public
# (001-T6), separadas do worker e da API (design 004 §13). O banco não publica
# porta no host (INFRA 6.2): a execução é pelo serviço `consolidado-migracao`
# do compose, na rede do consolidado, a partir da raiz do repositório:
#
#   docker compose -f infra/compose.yaml run --rm --build consolidado-migracao
#
# A conexão vem de variáveis de ambiente (ver env.py), nunca deste arquivo.
[alembic]
script_location = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
