# Ambiente local do CashFlow (001, TD-001: um único Compose).
# Segredos: interpolados de infra/.env, ignorado pelo Git (INFRA 5.9, 5.10).
# Bancos, RabbitMQ, Prometheus e exporters sem `ports`, só em redes internas:
# inacessíveis a partir do host (INFRA 6.1 a 6.3). Somente APIs, Keycloak e
# Grafana são publicados, e apenas em 127.0.0.1 (FR-007, INFRA 6.5, 6.6).
# Redes por fronteira: TD-002; observabilidade: 007 design §3, TD-007.
name: cashflow

services:
  pg-livro:
    # Versão: PostgreSQL 18.6, estável vigente ("current") em
    # https://www.postgresql.org/versions.json; tag em
    # https://hub.docker.com/_/postgres. Conferido em 2026-11-06 (TD-007).
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: livro
      POSTGRES_PASSWORD: ${PG_LIVRO_SENHA_SUPERUSUARIO:?defina PG_LIVRO_SENHA_SUPERUSUARIO em infra/.env}
      # Senhas dos papéis do livro, lidas por postgres/livro/10-papeis.sh
      # (001-T6; design 001 §4, TD-003).
      PG_LIVRO_SENHA_MIGRACAO: ${PG_LIVRO_SENHA_MIGRACAO:?defina PG_LIVRO_SENHA_MIGRACAO em infra/.env}
      PG_LIVRO_SENHA_API: ${PG_LIVRO_SENHA_API:?defina PG_LIVRO_SENHA_API em infra/.env}
      PG_LIVRO_SENHA_RELAY: ${PG_LIVRO_SENHA_RELAY:?defina PG_LIVRO_SENHA_RELAY em infra/.env}
      PG_LIVRO_SENHA_REPLAY: ${PG_LIVRO_SENHA_REPLAY:?defina PG_LIVRO_SENHA_REPLAY em infra/.env}
      PG_LIVRO_SENHA_MONITORAMENTO: ${PG_LIVRO_SENHA_MONITORAMENTO:?defina PG_LIVRO_SENHA_MONITORAMENTO em infra/.env}
    networks:
      - rede-livro
    volumes:
      # A partir do PostgreSQL 18 a imagem guarda os dados em
      # /var/lib/postgresql/18/docker; o volume monta o diretório pai.
      - vol-pg-livro:/var/lib/postgresql
      # Papéis e privilégios, aplicados só na criação do volume (001-T6).
      - ./postgres/livro:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d livro"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  livro-migracao:
    # Migrações Alembic do livro com o papel livro_migracao, separadas da API
    # (002-T2; design 002 §13; INFRA 3.3). Execução única, sob demanda:
    #
    #   docker compose -f infra/compose.yaml run --rm --build livro-migracao
    #
    # O perfil mantém o serviço fora do `up`, que aguarda contêineres de longa
    # duração. Versões das imagens base: services/lancamentos/migracoes/Dockerfile.
    profiles: ["migracao"]
    build:
      context: ..
      dockerfile: services/lancamentos/migracoes/Dockerfile
    environment:
      PG_LIVRO_SENHA_MIGRACAO: ${PG_LIVRO_SENHA_MIGRACAO:?defina PG_LIVRO_SENHA_MIGRACAO em infra/.env}
    networks:
      - rede-livro
    depends_on:
      pg-livro:
        condition: service_healthy
    restart: "no"

  lancamentos-api:
    # API de lançamentos (spec 002; 002-T5). HTTPS com o certificado da AC
    # local (INFRA 5.7, 5.8); JWT validado na própria API com cache de JWKS
    # (INFRA 5.5, 5.6). Não fala com RabbitMQ nem com o consolidado (INFRA
    # 2.1). Versões das imagens base: services/lancamentos/Dockerfile.
    #
    # Pressupõe o esquema aplicado pelo serviço livro-migracao; sem ele, o
    # ready fica falso.
    build:
      context: ..
      dockerfile: services/lancamentos/Dockerfile
    environment:
      PG_LIVRO_HOST: pg-livro
      PG_LIVRO_SENHA_API: ${PG_LIVRO_SENHA_API:?defina PG_LIVRO_SENHA_API em infra/.env}
      # Emissor (`iss`) igual a KC_HOSTNAME do Keycloak; o JWKS é lido pelo
      # nome interno, que consta do certificado do Keycloak (001-T3).
      JWT_EMISSOR: https://localhost:${KEYCLOAK_PORTA_HOST:-8443}/realms/cashflow
      JWT_JWKS_URL: https://keycloak:8443/realms/cashflow/protocol/openid-connect/certs
      JWT_AC_ARQUIVO: /etc/cashflow/tls/ac-cashflow.crt
      JWT_JWKS_TTL_SEGUNDOS: "300"
      TLS_CERTIFICADO: /etc/cashflow/tls/lancamentos-api.crt
      TLS_CHAVE: /etc/cashflow/tls/lancamentos-api.key
      API_PORTA: "8443"
      # /metrics em porta interna, sem publicação no host (007 design §4),
      # escutando só no alias da rede do livro: a rede de identidade não é
      # interna e o host a alcança (007 TD-007; INFRA 6.1).
      METRICAS_PORTA: "9464"
      METRICAS_ENDERECO: lancamentos-api-metricas
    # Só a porta TLS, só em loopback (INFRA 6.5, 6.6).
    # LANCAMENTOS_API_PORTA_HOST troca a porta do host se 8444 estiver ocupada.
    ports:
      - "127.0.0.1:${LANCAMENTOS_API_PORTA_HOST:-8444}:8443"
    # Banco do livro e JWKS do Keycloak (design 001 §3). O alias existe só na
    # rede do livro, onde o Prometheus coleta o /metrics (007 TD-007).
    networks:
      rede-livro:
        aliases:
          - lancamentos-api-metricas
      rede-identidade: {}
    volumes:
      # Gerados por infra/tls/gerar-certificados.sh (001-T3). A chave tem modo
      # 0640 e pertence ao usuário que gerou; o contêiner roda com UID 1000.
      - ./tls/gerados/ac/ac-cashflow.crt:/etc/cashflow/tls/ac-cashflow.crt:ro
      - ./tls/gerados/lancamentos-api.crt:/etc/cashflow/tls/lancamentos-api.crt:ro
      - ./tls/gerados/lancamentos-api.key:/etc/cashflow/tls/lancamentos-api.key:ro
    depends_on:
      pg-livro:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Pronto = /health/ready com 200 por TLS: banco do livro e JWKS
      # (INFRA 8.5).
      test: ["CMD", "python", "-m", "lancamentos.adaptadores.http.sonda"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  relay:
    # Relay da outbox (spec 003; 003-T5): reserva eventos pendentes, publica
    # com confirms e `mandatory` e marca só o confirmado (design 003 §3). Só
    # nas redes do livro e da mensageria: não alcança pg-consolidado (INFRA
    # 6.7). Papel livro_relay e usuário `relay` do RabbitMQ (INFRA 5.11).
    # Versões das imagens base: services/relay/Dockerfile.
    #
    # Pressupõe o esquema aplicado pelo serviço livro-migracao; sem ele, o
    # ready fica falso.
    build:
      context: ..
      dockerfile: services/relay/Dockerfile
    environment:
      PG_LIVRO_HOST: pg-livro
      PG_LIVRO_SENHA_RELAY: ${PG_LIVRO_SENHA_RELAY:?defina PG_LIVRO_SENHA_RELAY em infra/.env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_SENHA_RELAY: ${RABBITMQ_SENHA_RELAY:?defina RABBITMQ_SENHA_RELAY em infra/.env}
      # Intervalo, lote, lease e espera configuráveis (DQ-002; D-002). Os
      # testes de falha encurtam a espera pelo ambiente do host.
      RELAY_INTERVALO_SEGUNDOS: ${RELAY_INTERVALO_SEGUNDOS:-1}
      RELAY_LOTE: ${RELAY_LOTE:-100}
      RELAY_LEASE_SEGUNDOS: ${RELAY_LEASE_SEGUNDOS:-30}
      RELAY_TIMEOUT_CONFIRMACAO_SEGUNDOS: ${RELAY_TIMEOUT_CONFIRMACAO_SEGUNDOS:-5}
      RELAY_ESPERA_BASE_SEGUNDOS: ${RELAY_ESPERA_BASE_SEGUNDOS:-1}
      RELAY_ESPERA_TETO_SEGUNDOS: ${RELAY_ESPERA_TETO_SEGUNDOS:-60}
      # Health e /metrics em portas internas, sem publicação no host (INFRA
      # 6.1; 007 design §4).
      HEALTH_PORTA: "8080"
      METRICAS_PORTA: "9464"
    networks:
      - rede-livro
      - rede-mensageria
    depends_on:
      pg-livro:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Pronto = /health/ready com 200: outbox legível como livro_relay e
      # RabbitMQ conectado (INFRA 8.5).
      test: ["CMD", "python", "-m", "relay.adaptadores.http.sonda"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  relay-republicar:
    # Republicação a partir de uma posição (003-T4; TD-004; INFRA 7.6), com a
    # imagem do relay e o papel livro_replay (INFRA 6.4). Só na rede do livro:
    # o comando apenas reabre eventos no banco; quem publica é o relay.
    # Execução sob demanda, pelo operador:
    #
    #   docker compose -f infra/compose.yaml run --rm relay-republicar --desde-posicao N
    #
    # O perfil mantém o serviço fora do `up`, como livro-migracao.
    profiles: ["operacao"]
    build:
      context: ..
      dockerfile: services/relay/Dockerfile
    entrypoint: ["python", "-m", "relay.comandos.republicar"]
    command: ["--help"]
    environment:
      PG_LIVRO_HOST: pg-livro
      PG_LIVRO_SENHA_REPLAY: ${PG_LIVRO_SENHA_REPLAY:?defina PG_LIVRO_SENHA_REPLAY em infra/.env}
    networks:
      - rede-livro
    depends_on:
      pg-livro:
        condition: service_healthy
    restart: "no"

  livro-relatorio:
    # Relatório de totais por data do livro até uma posição, para a
    # reconciliação (005-T5; D-002; design 005 §4), com a imagem da API de
    # lançamentos e o papel livro_replay, que só lê posição, tipo, valor e
    # data (migração 0004; FR-008; INFRA 5.11, 6.4). Só na rede do livro: o
    # relatório sai pela saída padrão e chega ao coordenador por arquivo ou
    # pela entrada padrão, nunca por rede entre os lados (INFRA 6.7). Sem
    # porta. Execução sob demanda, pelo operador:
    #
    #   docker compose -f infra/compose.yaml run --rm -T livro-relatorio > relatorio.json
    #   docker compose -f infra/compose.yaml run --rm -T coordenador reconciliar < relatorio.json
    #
    # O perfil mantém o serviço fora do `up`, como livro-migracao. Versões das
    # imagens base: services/lancamentos/Dockerfile.
    profiles: ["operacao"]
    build:
      context: ..
      dockerfile: services/lancamentos/Dockerfile
    # O entrypoint do compose descarta o CMD da imagem (a API); argumentos do
    # `run`, como `--ate-posicao P`, vão para o comando.
    entrypoint: ["python", "-m", "lancamentos.comandos.relatorio"]
    environment:
      PG_LIVRO_HOST: pg-livro
      PG_LIVRO_SENHA_REPLAY: ${PG_LIVRO_SENHA_REPLAY:?defina PG_LIVRO_SENHA_REPLAY em infra/.env}
    networks:
      - rede-livro
    depends_on:
      pg-livro:
        condition: service_healthy
    restart: "no"

  pg-consolidado:
    # Mesma versão e fonte de pg-livro (TD-007, 2026-11-06).
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: consolidado
      POSTGRES_PASSWORD: ${PG_CONSOLIDADO_SENHA_SUPERUSUARIO:?defina PG_CONSOLIDADO_SENHA_SUPERUSUARIO em infra/.env}
      # Senhas dos papéis do consolidado, lidas por
      # postgres/consolidado/10-papeis.sh (001-T6; design 001 §4, TD-003).
      PG_CONSOLIDADO_SENHA_MIGRACAO: ${PG_CONSOLIDADO_SENHA_MIGRACAO:?defina PG_CONSOLIDADO_SENHA_MIGRACAO em infra/.env}
      PG_CONSOLIDADO_SENHA_WORKER: ${PG_CONSOLIDADO_SENHA_WORKER:?defina PG_CONSOLIDADO_SENHA_WORKER em infra/.env}
      PG_CONSOLIDADO_SENHA_API: ${PG_CONSOLIDADO_SENHA_API:?defina PG_CONSOLIDADO_SENHA_API em infra/.env}
      PG_CONSOLIDADO_SENHA_OPERACAO: ${PG_CONSOLIDADO_SENHA_OPERACAO:?defina PG_CONSOLIDADO_SENHA_OPERACAO em infra/.env}
      PG_CONSOLIDADO_SENHA_MONITORAMENTO: ${PG_CONSOLIDADO_SENHA_MONITORAMENTO:?defina PG_CONSOLIDADO_SENHA_MONITORAMENTO em infra/.env}
    networks:
      - rede-consolidado
    volumes:
      - vol-pg-consolidado:/var/lib/postgresql
      # Papéis e privilégios, aplicados só na criação do volume (001-T6).
      - ./postgres/consolidado:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consolidado"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consolidado-migracao:
    # Migrações Alembic do consolidado com o papel consolidado_migracao,
    # separadas do worker e da API (004-T1; design 004 §13; INFRA 3.3). Cria
    # as tabelas e a geração inicial ativa. Execução única, sob demanda:
    #
    #   docker compose -f infra/compose.yaml run --rm --build consolidado-migracao
    #
    # O perfil mantém o serviço fora do `up`, como livro-migracao. Só na rede
    # do consolidado (INFRA 6.7). Versões das imagens base:
    # services/consolidado/migracoes/Dockerfile.
    profiles: ["migracao"]
    build:
      context: ..
      dockerfile: services/consolidado/migracoes/Dockerfile
    environment:
      PG_CONSOLIDADO_SENHA_MIGRACAO: ${PG_CONSOLIDADO_SENHA_MIGRACAO:?defina PG_CONSOLIDADO_SENHA_MIGRACAO em infra/.env}
    networks:
      - rede-consolidado
    depends_on:
      pg-consolidado:
        condition: service_healthy
    restart: "no"

  coordenador:
    # Coordenador da projeção (spec 005; 005-T3 a T5): CLI que inicia,
    # acompanha e cancela a reconstrução em geração candidata, troca a
    # geração ativa e reconcilia a ativa com o relatório de livro-relatorio,
    # lido da entrada padrão (design 005 §3, §4). Papel
    # consolidado_operacao (FR-008; INFRA 5.11). Só na rede do consolidado:
    # não alcança pg-livro (INFRA 6.7); a republicação da outbox é feita no
    # lado do livro, pelo serviço relay-republicar. Sem porta (INFRA 6.4).
    # Execução sob demanda, pelo operador:
    #
    #   docker compose -f infra/compose.yaml run --rm --build coordenador reconstruir iniciar
    #   docker compose -f infra/compose.yaml run --rm coordenador reconstruir status
    #   docker compose -f infra/compose.yaml run --rm coordenador reconstruir cancelar
    #   docker compose -f infra/compose.yaml run --rm -T coordenador reconciliar < relatorio.json
    #
    # O perfil mantém o serviço fora do `up`, como livro-migracao. Versões das
    # imagens base: services/coordenador/Dockerfile.
    profiles: ["operacao"]
    build:
      context: ..
      dockerfile: services/coordenador/Dockerfile
    environment:
      PG_CONSOLIDADO_HOST: pg-consolidado
      PG_CONSOLIDADO_SENHA_OPERACAO: ${PG_CONSOLIDADO_SENHA_OPERACAO:?defina PG_CONSOLIDADO_SENHA_OPERACAO em infra/.env}
    networks:
      - rede-consolidado
    depends_on:
      pg-consolidado:
        condition: service_healthy
    restart: "no"

  worker:
    # Worker do consolidado (spec 004; 004-T3): consome a fila com ACK manual
    # após o commit, deduplica por inbox e contribuição e guarda conflitos e
    # mensagens ilegíveis na quarentena (design 004 §3). Só nas redes do
    # consolidado e da mensageria: não alcança pg-livro (INFRA 6.7). Papel
    # consolidado_worker e usuário `worker` do RabbitMQ, só de leitura da
    # fila (INFRA 5.11). Versões das imagens base:
    # services/consolidado/Dockerfile.
    #
    # Pressupõe o esquema aplicado pelo serviço consolidado-migracao; sem
    # ele, o ready fica falso e o consumo, pausado.
    build:
      context: ..
      dockerfile: services/consolidado/Dockerfile
    environment:
      PG_CONSOLIDADO_HOST: pg-consolidado
      PG_CONSOLIDADO_SENHA_WORKER: ${PG_CONSOLIDADO_SENHA_WORKER:?defina PG_CONSOLIDADO_SENHA_WORKER em infra/.env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_SENHA_WORKER: ${RABBITMQ_SENHA_WORKER:?defina RABBITMQ_SENHA_WORKER em infra/.env}
      # Mensagens não confirmadas por canal e espera entre reconexões
      # (DQ-003). Os testes de falha encurtam a espera pelo ambiente do host.
      WORKER_PREFETCH: ${WORKER_PREFETCH:-10}
      WORKER_INTERVALO_RECONEXAO_SEGUNDOS: ${WORKER_INTERVALO_RECONEXAO_SEGUNDOS:-2}
      # Health e /metrics em portas internas, sem publicação no host (INFRA
      # 6.1; 007 design §4).
      HEALTH_PORTA: "8080"
      METRICAS_PORTA: "9464"
    networks:
      - rede-consolidado
      - rede-mensageria
    depends_on:
      pg-consolidado:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Pronto = /health/ready com 200: controle da projeção legível como
      # consolidado_worker e RabbitMQ conectado (INFRA 8.5).
      test: ["CMD", "python", "-m", "consolidado.worker.sonda"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  consolidado-api:
    # API do consolidado (spec 004; 004-T5): saldo por data e por intervalo e
    # sinal de inclusão, só da geração ativa (design 004 §4; INFRA 2.3).
    # HTTPS com o certificado da AC local (INFRA 5.7, 5.8); JWT com
    # `consolidado:consultar` validado na própria API com cache de JWKS
    # (INFRA 5.4 a 5.6). Papel consolidado_api, somente leitura (INFRA
    # 5.11). Só nas redes do consolidado e da identidade: não alcança
    # pg-livro nem o RabbitMQ (INFRA 6.7). Mesma imagem do worker, com outro
    # comando; versões das imagens base: services/consolidado/Dockerfile.
    #
    # Pressupõe o esquema aplicado pelo serviço consolidado-migracao; sem
    # ele, o ready fica falso.
    build:
      context: ..
      dockerfile: services/consolidado/Dockerfile
    command: ["python", "-m", "consolidado.adaptadores.http"]
    # UID e GID 1000: a chave TLS montada do host tem modo 0640 e pertence a
    # quem a gerou (infra/tls/gerar-certificados.sh), como em lancamentos-api.
    user: "1000:1000"
    environment:
      PG_CONSOLIDADO_HOST: pg-consolidado
      PG_CONSOLIDADO_SENHA_API: ${PG_CONSOLIDADO_SENHA_API:?defina PG_CONSOLIDADO_SENHA_API em infra/.env}
      # Emissor (`iss`) igual a KC_HOSTNAME do Keycloak; o JWKS é lido pelo
      # nome interno, que consta do certificado do Keycloak (001-T3).
      JWT_EMISSOR: https://localhost:${KEYCLOAK_PORTA_HOST:-8443}/realms/cashflow
      JWT_JWKS_URL: https://keycloak:8443/realms/cashflow/protocol/openid-connect/certs
      JWT_AC_ARQUIVO: /etc/cashflow/tls/ac-cashflow.crt
      JWT_JWKS_TTL_SEGUNDOS: "300"
      TLS_CERTIFICADO: /etc/cashflow/tls/consolidado-api.crt
      TLS_CHAVE: /etc/cashflow/tls/consolidado-api.key
      API_PORTA: "8443"
      # Dias por página do intervalo: padrão e máximo (TD-008).
      SALDOS_LIMITE_PADRAO: ${SALDOS_LIMITE_PADRAO:-50}
      SALDOS_LIMITE_MAXIMO: ${SALDOS_LIMITE_MAXIMO:-500}
      # Leitura da fase gravada pelo coordenador para
      # `cashflow_reconstrucao_fase` (005-T3; 007 design §4).
      FASE_INTERVALO_SEGUNDOS: ${FASE_INTERVALO_SEGUNDOS:-10}
      # /metrics em porta interna, sem publicação no host (007 design §4),
      # escutando só no alias da rede do consolidado: a rede de identidade
      # não é interna e o host a alcança (007 TD-007; INFRA 6.1).
      METRICAS_PORTA: "9464"
      METRICAS_ENDERECO: consolidado-api-metricas
    # Só a porta TLS, só em loopback (INFRA 6.5, 6.6).
    # CONSOLIDADO_API_PORTA_HOST troca a porta do host se 8445 estiver ocupada.
    ports:
      - "127.0.0.1:${CONSOLIDADO_API_PORTA_HOST:-8445}:8443"
    # Banco do consolidado e JWKS do Keycloak (design 001 §3). O alias existe
    # só na rede do consolidado, onde o Prometheus coleta o /metrics (007
    # TD-007).
    networks:
      rede-consolidado:
        aliases:
          - consolidado-api-metricas
      rede-identidade: {}
    volumes:
      # Gerados por infra/tls/gerar-certificados.sh (001-T3).
      - ./tls/gerados/ac/ac-cashflow.crt:/etc/cashflow/tls/ac-cashflow.crt:ro
      - ./tls/gerados/consolidado-api.crt:/etc/cashflow/tls/consolidado-api.crt:ro
      - ./tls/gerados/consolidado-api.key:/etc/cashflow/tls/consolidado-api.key:ro
    depends_on:
      pg-consolidado:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Pronto = /health/ready com 200 por TLS: geração ativa legível como
      # consolidado_api e JWKS (INFRA 8.5).
      test: ["CMD", "python", "-m", "consolidado.adaptadores.http.sonda"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  rabbitmq:
    # Versão: RabbitMQ 4.4.0, última GA em
    # https://www.rabbitmq.com/release-information (lançada em 2026-10-20);
    # tag em https://hub.docker.com/_/rabbitmq. Conferido em 2026-11-06
    # (TD-007). A variante management atende TD-006. O plugin Prometheus
    # expõe as métricas na porta 15692, só na rede da mensageria (007 design
    # §3).
    image: rabbitmq:4.4.0-management-alpine
    # O nome do nó (rabbit@<hostname>) define o diretório de dados no volume;
    # hostname fixo mantém os dados ao recriar o contêiner (FR-010).
    hostname: rabbitmq
    entrypoint: ["/etc/rabbitmq/cashflow/entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_SENHA_RELAY: ${RABBITMQ_SENHA_RELAY:?defina RABBITMQ_SENHA_RELAY em infra/.env}
      RABBITMQ_SENHA_WORKER: ${RABBITMQ_SENHA_WORKER:?defina RABBITMQ_SENHA_WORKER em infra/.env}
    networks:
      - rede-mensageria
    volumes:
      - vol-rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/entrypoint.sh:/etc/rabbitmq/cashflow/entrypoint.sh:ro
      - ./rabbitmq/definicoes.modelo.json:/etc/rabbitmq/cashflow/definicoes.modelo.json:ro
      - ./rabbitmq/20-cashflow.conf:/etc/rabbitmq/conf.d/20-cashflow.conf:ro
      # Plugins habilitados declarados no repositório, sem depender do padrão
      # da imagem (007-T1).
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      # Pronto = listeners aceitando conexão, não só processo vivo (INFRA 8.5).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  keycloak:
    # Versão: Keycloak 26.8.2, última release estável em
    # https://github.com/keycloak/keycloak/releases (lançada em 2026-11-05);
    # tag em https://quay.io/repository/keycloak/keycloak. Conferido em
    # 2026-11-06 (TD-007).
    image: quay.io/keycloak/keycloak:26.8.2
    # Modo produção: sem listener HTTP, só HTTPS com o certificado da AC local
    # (FR-006; INFRA 5.7, 5.8). O realm entra pela importação, que é ignorada
    # quando o realm já existe no volume (TD-005).
    command: ["start", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/keycloak.key
      # Emissor fixo (`iss`) no endereço que o cliente técnico usa pelo host,
      # o mesmo da publicação em loopback abaixo. As APIs buscam o JWKS pelo
      # nome interno `keycloak` (backchannel dinâmico).
      KC_HOSTNAME: https://localhost:${KEYCLOAK_PORTA_HOST:-8443}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Instância única: banco embutido no volume e cache local, sem cluster.
      # O banco embutido é desaconselhado para produção; aqui atende o
      # ambiente local de um nó só (INFRA - Fora do escopo: alta
      # disponibilidade).
      KC_DB: dev-file
      KC_CACHE: local
      # Readiness em HTTP só no loopback do contêiner: nenhum outro contêiner
      # alcança a interface de gerenciamento, e o tráfego de rede continua
      # exclusivamente em TLS (FR-006, FR-009).
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTP_MANAGEMENT_HOST: 127.0.0.1
      # Administração no realm master, separada dos clientes técnicos do realm
      # cashflow (FR-005; INFRA 5.11). Usado só na criação do realm master.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin-cashflow
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_SENHA_ADMIN:?defina KEYCLOAK_SENHA_ADMIN em infra/.env}
      # Lidos pelos placeholders de realm-cashflow.json na importação; depois
      # dela, o segredo vigente é o gravado no volume (TD-005).
      KEYCLOAK_SEGREDO_CLIENTE_LANCAMENTOS: ${KEYCLOAK_SEGREDO_CLIENTE_LANCAMENTOS:?defina KEYCLOAK_SEGREDO_CLIENTE_LANCAMENTOS em infra/.env}
      KEYCLOAK_SEGREDO_CLIENTE_CONSULTAS: ${KEYCLOAK_SEGREDO_CLIENTE_CONSULTAS:?defina KEYCLOAK_SEGREDO_CLIENTE_CONSULTAS em infra/.env}
    # Só a porta TLS, só em loopback (FR-006, FR-007; INFRA 6.5, 6.6).
    # KEYCLOAK_PORTA_HOST troca a porta do host se 8443 estiver ocupada.
    ports:
      - "127.0.0.1:${KEYCLOAK_PORTA_HOST:-8443}:8443"
    networks:
      - rede-identidade
    volumes:
      - vol-keycloak:/opt/keycloak/data
      - ./keycloak/realm-cashflow.json:/opt/keycloak/data/import/realm-cashflow.json:ro
      # Gerados por infra/tls/gerar-certificados.sh (001-T3). A chave tem modo
      # 0640 e pertence ao usuário que gerou; o contêiner roda com UID 1000.
      - ./tls/gerados/keycloak.crt:/opt/keycloak/conf/tls/keycloak.crt:ro
      - ./tls/gerados/keycloak.key:/opt/keycloak/conf/tls/keycloak.key:ro
    healthcheck:
      # Pronto = /health/ready com 200, não só processo vivo (INFRA 8.5). A
      # imagem não traz curl; a requisição sai pelo /dev/tcp do bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  postgres-exporter-livro:
    # Métricas do pg-livro, inclusive o tamanho do banco (spec 007; 007-T1;
    # design 007 §3). Papel livro_monitoramento, só com pg_monitor (INFRA
    # 5.11). Só na rede do livro (INFRA 6.7).
    #
    # Versão: postgres_exporter 0.20.1, última release estável em
    # https://github.com/prometheus-community/postgres_exporter/releases
    # (lançada em 2026-07-08); tag em
    # https://quay.io/repository/prometheuscommunity/postgres-exporter.
    # Conferido em 2026-11-06 (001 TD-007).
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: pg-livro:5432/livro?sslmode=disable
      DATA_SOURCE_USER: livro_monitoramento
      DATA_SOURCE_PASS: ${PG_LIVRO_SENHA_MONITORAMENTO:?defina PG_LIVRO_SENHA_MONITORAMENTO em infra/.env}
    networks:
      - rede-livro
    depends_on:
      pg-livro:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-consolidado:
    # Métricas do pg-consolidado (007-T1). Papel consolidado_monitoramento, só
    # com pg_monitor (INFRA 5.11). Só na rede do consolidado (INFRA 6.7).
    # Mesma versão e fonte de postgres-exporter-livro.
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: pg-consolidado:5432/consolidado?sslmode=disable
      DATA_SOURCE_USER: consolidado_monitoramento
      DATA_SOURCE_PASS: ${PG_CONSOLIDADO_SENHA_MONITORAMENTO:?defina PG_CONSOLIDADO_SENHA_MONITORAMENTO em infra/.env}
    networks:
      - rede-consolidado
    depends_on:
      pg-consolidado:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    # Coleta das métricas de INFRA 8.3 (spec 007; 007-T1; ST-Q-008). Só lê:
    # coleta o /metrics de cada componente nas redes internas, todas sem rota
    # a partir do host, e não publica porta (007 design §3, TD-007; INFRA
    # 6.1). Alvos em observabilidade/prometheus.yml; limites e alertas de
    # FR-006 em observabilidade/regras.yml (007-T4).
    #
    # Versão: Prometheus 3.16.0, última release estável em
    # https://github.com/prometheus/prometheus/releases (lançada em
    # 2026-11-05); tag em https://hub.docker.com/r/prom/prometheus.
    # Conferido em 2026-11-06 (001 TD-007).
    image: prom/prometheus:v3.16.0
    networks:
      - rede-livro
      - rede-consolidado
      - rede-mensageria
      - rede-observabilidade
    volumes:
      - vol-prometheus:/prometheus
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Limites e alertas de FR-006 (007-T4).
      - ./observabilidade/regras.yml:/etc/prometheus/regras.yml:ro
    healthcheck:
      # Pronto = /-/ready com 200: configuração carregada e TSDB aberto
      # (007 FR-005; INFRA 8.5).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  grafana:
    # Visualização das métricas (spec 007; 007-T1; ST-Q-008). HTTPS com o
    # certificado da AC local, publicado só em loopback (INFRA 5.7, 6.5, 6.6).
    # Lê o Prometheus pela rede da observabilidade; a segunda rede existe só
    # para a publicação (007 TD-007). Fonte de dados e painéis provisionados
    # de observabilidade/grafana (007-T3).
    #
    # Versão: Grafana OSS 13.3.0, última release estável em
    # https://github.com/grafana/grafana/releases (lançada em 2026-10-27);
    # tag em https://hub.docker.com/r/grafana/grafana. Conferido em
    # 2026-11-06 (001 TD-007).
    image: grafana/grafana:13.3.0
    # UID e GID 1000: a chave TLS montada do host tem modo 0640 e pertence a
    # quem a gerou (infra/tls/gerar-certificados.sh), como em consolidado-api.
    # O diretório de dados da imagem aceita qualquer UID.
    user: "1000:1000"
    environment:
      GF_SERVER_PROTOCOL: https
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_CERT_FILE: /etc/grafana/tls/grafana.crt
      GF_SERVER_CERT_KEY: /etc/grafana/tls/grafana.key
      GF_SERVER_ROOT_URL: https://localhost:${GRAFANA_PORTA_HOST:-8446}/
      # Administrador local; a senha vale só na criação do banco do Grafana
      # no volume (INFRA 5.9). Sem cadastro aberto nem acesso anônimo.
      GF_SECURITY_ADMIN_USER: admin-cashflow
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA_ADMIN:?defina GRAFANA_SENHA_ADMIN em infra/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Nada sai para a internet: sem telemetria, sem busca de atualizações
      # e sem instalação de plugins na subida.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    # Só a porta TLS, só em loopback (INFRA 6.5, 6.6).
    # GRAFANA_PORTA_HOST troca a porta do host se 8446 estiver ocupada.
    ports:
      - "127.0.0.1:${GRAFANA_PORTA_HOST:-8446}:3000"
    networks:
      - rede-observabilidade
      - rede-publicacao-grafana
    volumes:
      - vol-grafana:/var/lib/grafana
      # Gerados por infra/tls/gerar-certificados.sh (001-T3).
      - ./tls/gerados/ac/ac-cashflow.crt:/etc/grafana/tls/ac-cashflow.crt:ro
      - ./tls/gerados/grafana.crt:/etc/grafana/tls/grafana.crt:ro
      - ./tls/gerados/grafana.key:/etc/grafana/tls/grafana.key:ro
      # Fonte de dados e painel CashFlow versionados, carregados na subida
      # (007-T3; design 007 §4 Provisionamento, §7). Só os subdiretórios
      # usados: os demais (alerting, plugins) ficam os vazios da imagem.
      - ./observabilidade/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observabilidade/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observabilidade/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      # Pronto = /api/health com 200 por TLS: banco interno do Grafana
      # acessível (007 FR-005; INFRA 8.5).
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - --cacert
        - /etc/grafana/tls/ac-cashflow.crt
        - https://localhost:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

# Quatro redes por fronteira (design 001 §3, TD-002). Não há rede comum entre
# o lado do consolidado (worker, consolidado-api, coordenador) e pg-livro
# (INFRA 6.7).
#
# Livro, consolidado e mensageria são internas e sem endereço IPv4 na ponte do
# host (inhibit_ipv4): sem saída para fora e sem rota do host até os
# contêineres, nem pelo IP interno (INFRA 6.1 a 6.3). A comunicação entre
# contêineres da mesma rede continua normal.
#
# A identidade não é interna porque o Docker não publica portas de contêiner
# ligado só a redes internas, e Keycloak e APIs precisam ser publicados em
# loopback.
#
# Observabilidade (007 design §3, TD-007): rede-observabilidade, entre
# Prometheus e Grafana, é interna e sem IPv4 na ponte do host, como as de
# dados. rede-publicacao-grafana não é interna, pelo mesmo motivo da
# identidade, e só tem o Grafana.
networks:
  rede-livro:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  rede-consolidado:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  rede-mensageria:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  rede-identidade:
  rede-observabilidade:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  rede-publicacao-grafana:

volumes:
  vol-pg-livro:
  vol-pg-consolidado:
  vol-rabbitmq:
  vol-keycloak:
  vol-prometheus:
  vol-grafana:
